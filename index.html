<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6d3f20">
<link rel="manifest" href="manifest.json">
<title>Waheguru Naam Jap</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:radial-gradient(circle at top,#fff9ef 0,#f4e8d4 45%,#ead7bc 100%);color:#3d2a1d;text-align:center}
.wrap{max-width:430px;margin:auto;padding:24px 18px 35px}
.logo{width:82px;height:82px;margin:4px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#a96f3f,#603719);box-shadow:0 8px 22px #0003;border:4px solid #f9e9ce;font-size:42px}
h1{margin:4px 0 2px;font-family:Georgia,serif;font-size:31px;letter-spacing:.4px;background:linear-gradient(90deg,#6a3b1d,#b06a2c,#6a3b1d);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:14px;opacity:.72;margin-bottom:20px}
.card{background:#fffaf2eF;border-radius:26px;padding:21px;box-shadow:0 10px 28px #6b431c1c;margin-bottom:16px;border:1px solid #ead9bf}
.label{font-size:14px;opacity:.62}.count{font-size:58px;font-weight:800;margin:7px 0 15px}
.japbtn{width:190px;height:190px;border-radius:50%;border:0;color:#fff;background:radial-gradient(circle at 35% 28%,#b87a48,#7b471f 62%,#573014 100%);font-family:Georgia,serif;font-size:31px;font-weight:700;box-shadow:0 10px 25px #5c351d55, inset 0 2px 4px #ffffff44;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.japbtn:active,.japbtn.pressed{transform:scale(.94);box-shadow:0 4px 10px #5c351d44,inset 0 3px 8px #0004}
.ripple{animation:ripple .28s ease-out}@keyframes ripple{0%{box-shadow:0 0 0 0 #b47a4a88,0 10px 25px #5c351d55}100%{box-shadow:0 0 0 18px #b47a4a00,0 10px 25px #5c351d55}}
.total{font-size:32px;font-weight:800}.small{font-size:13px;opacity:.65;margin-top:7px}
.history{text-align:left;max-height:300px;overflow:auto}.day{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #eadfce}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) scale(.9);background:#3f2718;color:#fff;padding:11px 17px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:.15s;box-shadow:0 7px 20px #0003;z-index:5}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
</style></head>
<body><div class="wrap">
<div class="logo">🙏</div>
<h1>Waheguru Naam Jap</h1>
<div class="sub">Har click = 1 Waheguru • Waheguru Ji 🙏</div>

<div class="card">
<div class="label">Aaj ka Jap</div>
<div class="count" id="today">0</div>
<button class="japbtn" id="waheguru" aria-label="Waheguru naam jap">Waheguru</button>
<div class="small">Button dabate hi count +1 aur vibration</div>
</div>

<div class="card">
<div class="label">Total Jap</div>
<div class="total" id="total">0</div>
<div class="small">Sabhi dinon ka total</div>
</div>

<div class="card">
<div class="label">📅 Date-wise History</div>
<div class="history" id="history"></div>
</div>
</div>
<div class="toast" id="toast">🙏 Waheguru +1</div>

<script>
const STORAGE="waheguruNaamJapV3";
function dateKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE)||"{}")}catch(e){return {}}}
let data=load();
function save(){localStorage.setItem(STORAGE,JSON.stringify(data));render()}
function addJap(){
 const k=dateKey(); data[k]=(data[k]||0)+1; save();
 if(navigator.vibrate) navigator.vibrate(35);
 const b=document.getElementById("waheguru"),t=document.getElementById("toast");
 b.classList.remove("ripple"); void b.offsetWidth; b.classList.add("ripple");
 t.classList.add("show"); clearTimeout(window.tt); window.tt=setTimeout(()=>t.classList.remove("show"),450);
}
function fmt(n){return Number(n||0).toLocaleString("en-IN")}
function pretty(k){const [y,m,d]=k.split("-");return d+"-"+m+"-"+y}
function render(){
 const k=dateKey(); document.getElementById("today").textContent=fmt(data[k]||0);
 let keys=Object.keys(data).filter(k=>Number(data[k])>0).sort().reverse();
 let total=keys.reduce((s,k)=>s+Number(data[k]||0),0);
 document.getElementById("total").textContent=fmt(total);
 document.getElementById("history").innerHTML=keys.length?keys.map(k=>`<div class="day"><span>${pretty(k)}</span><strong>${fmt(data[k])}</strong></div>`).join(""):'<div class="small">Abhi koi history nahi hai.</div>';
}
document.getElementById("waheguru").addEventListener("click",addJap);
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script></body></html>
