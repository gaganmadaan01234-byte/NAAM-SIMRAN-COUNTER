<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8b5e3c">
<link rel="manifest" href="manifest.json">
<title>Naam Jap Counter</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f1e8;color:#3d2f24;text-align:center}
.wrap{max-width:430px;margin:auto;padding:28px 18px}.sub{opacity:.7;margin-bottom:22px}
h1{margin:8px 0 4px;font-size:30px}.card{background:#fffaf2;border-radius:24px;padding:22px;box-shadow:0 8px 25px #0001;margin-bottom:16px}
.label{font-size:14px;opacity:.65}.count{font-size:58px;font-weight:800;margin:8px 0}.small{font-size:14px;margin-top:12px;opacity:.7}
button{border:0;border-radius:18px;font-size:24px;font-weight:700;padding:18px 24px;background:#8b5e3c;color:white;touch-action:manipulation}
button:active{transform:scale(.97)}.row{display:flex;gap:10px;justify-content:center;align-items:center}.secondary{background:#e9dccb;color:#4b3828;font-size:15px;padding:11px 15px}
.bar{height:12px;background:#eadfce;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:#8b5e3c}
</style></head>
<body><div class="wrap">
<h1>🙏 Naam Jap Counter</h1><div class="sub">Waheguru Ji 🙏</div>
<div class="card"><div class="label">Aaj ka jap</div><div class="count" id="today">0</div>
<div class="label">Daily Target: 11,000</div><div class="bar"><div class="fill" id="fill"></div></div>
<div id="left">11,000 baaki</div><br><button id="add">+1 Jap</button>
<div class="row" style="margin-top:12px"><button class="secondary" onclick="add(10)">+10</button><button class="secondary" onclick="add(108)">+108</button><button class="secondary" onclick="add(1000)">+1000</button></div></div>
<div class="card"><div class="label">Total Jap</div><div class="count" style="font-size:40px" id="total">0</div>
<div class="small">31 Dec 2026 tak ka progress</div></div>
<button class="secondary" onclick="resetToday()">Aaj ka counter reset</button>
</div>
<script>
const key=()=>new Date().toISOString().slice(0,10);let d=JSON.parse(localStorage.getItem("naamJap")||'{"date":"","today":0,"total":0}');
if(d.date!==key()){d.date=key();d.today=0;save()}function save(){localStorage.setItem("naamJap",JSON.stringify(d));render()}
function add(n=1){d.today+=n;d.total+=n;save();if(navigator.vibrate)navigator.vibrate(10)}
function resetToday(){if(confirm("Aaj ka counter reset karna hai?")){d.total-=d.today;d.today=0;save()}}
function f(n){return n.toLocaleString("en-IN")}function render(){today.textContent=f(d.today);total.textContent=f(d.total);left.textContent=d.today>=11000?"Daily target complete 🙏":f(11000-d.today)+" baaki";fill.style.width=Math.min(100,d.today/11000*100)+"%"}add.onclick=()=>add(1);render();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body></html>
