<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waheguru Naam Jap</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f1e7;
  color:#3b2d24;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:center;
}

.wrap{
  max-width:430px;
  margin:auto;
  padding:35px 18px 45px;
}

.logo{
  font-size:58px;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:34px;
  font-weight:800;
  letter-spacing:-1px;
}

.sub{
  margin-top:8px;
  font-size:18px;
  color:#806f61;
}

.card{
  margin-top:30px;
  background:#fffaf2;
  border-radius:30px;
  padding:35px 20px;
  box-shadow:0 8px 30px rgba(70,50,30,.08);
}

.label{
  font-size:20px;
  color:#806f61;
  margin-bottom:18px;
}

.count{
  font-size:72px;
  font-weight:800;
  margin-bottom:28px;
}

.japbtn{
  width:210px;
  height:210px;
  border:0;
  border-radius:50%;
  background:#95663f;
  color:white;
  font-size:30px;
  font-weight:800;
  box-shadow:0 10px 25px rgba(100,65,35,.25);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:.12s;
}

.japbtn:active,
.japbtn.pressed{
  transform:scale(.94);
  box-shadow:0 5px 12px rgba(100,65,35,.2);
}

.small{
  margin-top:22px;
  color:#806f61;
  font-size:17px;
}

.total{
  font-size:38px;
  font-weight:800;
  margin-top:10px;
}

.history{
  margin-top:25px;
  text-align:left;
  font-size:16px;
  line-height:1.8;
  color:#66584e;
}

.history-title{
  text-align:center;
  font-size:20px;
  font-weight:700;
  margin-bottom:10px;
}

.day{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #e8ddce;
  padding:6px 2px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:35px;
  transform:translateX(-50%) scale(.9);
  background:#3b2d24;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}
</style>
</head>

<body>
<div class="wrap">

  <div class="logo">🙏</div>

  <h1>✨ Waheguru Naam Jap ✨</h1>

  <div class="sub">Waheguru Ji 🙏</div>

  <div class="card">

    <div class="label">Aaj ka Naam Jap</div>

    <div class="count" id="today">0</div>

    <button class="japbtn" id="waheguru">
      Waheguru Ji 🙏
    </button>

    <div class="small">Har click = 1 Naam Jap</div>

  </div>

  <div class="card">

    <div class="label">Total Naam Jap</div>

    <div class="total" id="total">0</div>

    <div class="history" id="history"></div>

  </div>

  <div class="toast" id="toast">🙏 Waheguru Ji</div>

</div>

<script>

const STORAGE="waheguruNaamJapV4";

function dateKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function load(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE)) || {};
  }catch(e){
    return {};
  }
}

function save(data){
  localStorage.setItem(STORAGE,JSON.stringify(data));
}

function addJap(){

  const data=load();
  const key=dateKey();

  data[key]=(data[key] || 0)+1;

  save(data);

  if(navigator.vibrate){
    navigator.vibrate(35);
  }

  const btn=document.getElementById("waheguru");

  btn.classList.add("pressed");

  setTimeout(()=>{
    btn.classList.remove("pressed");
  },120);

  const toast=document.getElementById("toast");

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },350);

  render();
}

function render(){

  const data=load();
  const key=dateKey();

  const today=data[key] || 0;

  let total=0;

  Object.keys(data).forEach(k=>{
    total += Number(data[k]) || 0;
  });

  document.getElementById("today").textContent=today;
  document.getElementById("total").textContent=total;

  const history=document.getElementById("history");

  const keys=Object.keys(data).sort().reverse();

  if(keys.length===0){
    history.innerHTML="";
    return;
  }

  let html='<div class="history-title">📅 Date-wise Naam Jap</div>';

  keys.forEach(k=>{
    html += `
      <div class="day">
        <span>${k}</span>
        <strong>${data[k]}</strong>
      </div>
    `;
  });

  history.innerHTML=html;
}

document.getElementById("waheguru").addEventListener("click",addJap);

render();

</script>

</body>
</html>
